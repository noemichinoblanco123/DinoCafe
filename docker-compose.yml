services:
  cafeteria_bd:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cafeteria_bd}
      POSTGRES_USER: ${POSTGRES_USER:-dinocafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dinocafe}
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dinocafe} -d ${POSTGRES_DB:-cafeteria_bd}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_ENGINE: postgres
      POSTGRES_DB: ${POSTGRES_DB:-cafeteria_bd}
      POSTGRES_USER: ${POSTGRES_USER:-dinocafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dinocafe}
      POSTGRES_HOST: cafeteria_bd
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
    ports:
      - "${BACKEND_PORT_HOST:-8000}:8000"
    depends_on:
      cafeteria_bd:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT_HOST:-8000}/api
    volumes:
      - ./frontend/dinocafe-frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT_HOST:-5173}:5173"
    depends_on:
      - backend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"

volumes:
  pgdata:
  frontend_node_modules:
